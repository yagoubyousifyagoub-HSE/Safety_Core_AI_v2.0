name: safety_core_ai
description: "Safety Core AI — Enterprise HSE Site Inspection & Audit Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Formatting, dates, and Arabic (ar_SA) number/date localization
  intl: ^0.19.0

  # Backend: Postgres + Auth + Storage + Realtime + Edge Functions
  supabase_flutter: ^2.5.6

  # GPS for geofencing + EXIF-style photo tagging
  geolocator: ^12.0.0

  # Consultant sign-off pad
  signature: ^5.5.0

  # Field photo capture
  image_picker: ^1.1.2

  # Pixel-level image ops used by watermark_service + image_compressor
  image: ^4.2.0

  path_provider: ^2.1.3
  path: ^1.9.0

  # 1-page HSE notice generation + native print/share sheet
  pdf: ^3.11.0
  printing: ^5.13.1

  # Offline-first local queue (pure-Dart storage, no code-gen required)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  connectivity_plus: ^6.0.3

  # LTIFR / TRIR dashboard charts
  fl_chart: ^0.68.0

  # tel: dialer for Stop-Work emergency contact + PayPal donate link
  url_launcher: ^6.3.0

  flutter_riverpod: ^2.5.1
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true # enables flutter gen-l10n from lib/l10n/*.arb, wired via l10n.yaml
  assets:
    - assets/images/
    - assets/icons/
