name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Extract Zip & Align Project Structure
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            mkdir -p extracted_temp
            unzip -o \*.zip -d extracted_temp/
            ROOT_PATH=$(find extracted_temp -type f -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
            if [ -n "$ROOT_PATH" ]; then
              cp -rf "$ROOT_PATH"/* ./
            fi
            rm -rf extracted_temp
          fi

      - name: 5. Ensure Android Platform & Grant Permissions
        run: |
          if [ ! -d "android" ]; then
            flutter create safety_core_ai --platforms=android --org com.safetycore.ai
            cp -r safety_core_ai/android ./
            rm -rf safety_core_ai
          fi
          
          # تثبيت اسم التطبيق
          sed -i 's/android:label="[^"]*"/android:label="Safety Core AI"/g' android/app/src/main/AndroidManifest.xml || true

          # منح إذن الإنترنت والشبكة لمنع تعذر الاتصال بالخوادم
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml

      - name: 6. Resolve Dependencies & Fix Keys
        run: |
          find lib/ -name "otp_verification_screen.dart" -exec sed -i "s/AppConstants\.otpCodeLength/6/g" {} + 2>/dev/null || true
          sed -i 's/intl:.*/intl: any/g' pubspec.yaml || true
          flutter pub get

      - name: 7. Generate Localization
        run: |
          if [ -f "l10n.yaml" ]; then
            flutter gen-l10n || true
          fi

      - name: 8. Build Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: 9. Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: safety-core-ai-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
