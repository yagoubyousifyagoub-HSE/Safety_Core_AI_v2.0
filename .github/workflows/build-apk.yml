      - name: 8. Flexible Bottom Navigation Supporting All Arguments
        run: |
          mkdir -p lib/core/widgets
          cat << 'EOF' > lib/core/widgets/elegant_bottom_nav.dart
          import 'package:flutter/material.dart';
          import '../services/language_controller.dart';

          class ElegantBottomNav extends StatelessWidget {
            final int? currentIndex;
            final int? index;
            final ValueChanged<int>? onTap;
            final ValueChanged<int>? onChanged;
            final dynamic items;
            final dynamic elevation;
            final dynamic backgroundColor;

            const ElegantBottomNav({
              super.key,
              this.currentIndex,
              this.index,
              this.onTap,
              this.onChanged,
              this.items,
              this.elevation,
              this.backgroundColor,
            });

            int get _selectedIndex => currentIndex ?? index ?? 0;

            void _handleTap(int idx) {
              onTap?.call(idx);
              onChanged?.call(idx);
            }

            @override
            Widget build(BuildContext context) {
              return ValueListenableBuilder<Locale>(
                valueListenable: LanguageController.currentLocale,
                builder: (context, locale, _) {
                  final isAr = locale.languageCode == 'ar';
                  final isDark = Theme.of(context).brightness == Brightness.dark;

                  final navList = [
                    {'icon': Icons.grid_view_rounded, 'title': isAr ? 'الرئيسية' : 'Home'},
                    {'icon': Icons.fact_check_outlined, 'title': isAr ? 'الملاحظات' : 'Observations'},
                    {'icon': Icons.picture_as_pdf_outlined, 'title': isAr ? 'التقارير' : 'Reports'},
                    {'icon': Icons.smart_toy_outlined, 'title': isAr ? 'المستشار' : 'Advisor'},
                    {'icon': Icons.info_outline_rounded, 'title': isAr ? 'حول' : 'About'},
                  ];

                  return Container(
                    decoration: BoxDecoration(
                      color: isDark ? const Color(0xFF111827) : Colors.white,
                      border: Border(top: BorderSide(color: isDark ? Colors.white12 : Colors.black12)),
                      boxShadow: [
                        BoxShadow(color: Colors.black.withOpacity(0.08), blurRadius: 10, offset: const Offset(0, -2))
                      ],
                    ),
                    child: SafeArea(
                      top: false,
                      child: Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 6),
                        child: Row(
                          children: List.generate(navList.length, (idx) {
                            final isSelected = _selectedIndex == idx;
                            return Expanded(
                              child: InkWell(
                                onTap: () => _handleTap(idx),
                                borderRadius: BorderRadius.circular(12),
                                child: AnimatedContainer(
                                  duration: const Duration(milliseconds: 200),
                                  padding: const EdgeInsets.symmetric(vertical: 6),
                                  decoration: BoxDecoration(
                                    color: isSelected ? Colors.blueAccent.withOpacity(0.15) : Colors.transparent,
                                    borderRadius: BorderRadius.circular(12),
                                  ),
                                  child: Column(
                                    mainAxisSize: MainAxisSize.min,
                                    children: [
                                      Icon(
                                        navList[idx]['icon'] as IconData,
                                        size: isSelected ? 24 : 22,
                                        color: isSelected ? Colors.blueAccent : (isDark ? Colors.white60 : Colors.black54),
                                      ),
                                      const SizedBox(height: 3),
                                      Text(
                                        navList[idx]['title'] as String,
                                        maxLines: 1,
                                        overflow: TextOverflow.ellipsis,
                                        style: TextStyle(
                                          fontSize: 10.5,
                                          fontWeight: isSelected ? FontWeight.bold : FontWeight.normal,
                                          color: isSelected ? Colors.blueAccent : (isDark ? Colors.white60 : Colors.black54),
                                        ),
                                      ),
                                    ],
                                  ),
                                ),
                              ),
                            );
                          }),
                        ),
                      ),
                    ),
                  );
                },
              );
            }
          }
          EOF

          python3 - << 'PYEOF'
          import os, re

          main_path = 'lib/main.dart'
          if os.path.exists(main_path):
              with open(main_path, 'r', encoding='utf-8') as f:
                  code = f.read()

              if 'language_controller.dart' not in code:
                  code = "import 'package:safety_core_ai/core/services/language_controller.dart';\n" + code

              if 'LanguageController.currentLocale' not in code:
                  match = re.search(r'return\s+MaterialApp\s*\(', code)
                  if match:
                      start = match.start()
                      depth = 1
                      i = match.end()
                      while i < len(code) and depth > 0:
                          if code[i] == '(': depth += 1
                          elif code[i] == ')': depth -= 1
                          i += 1
                      
                      mat_inner = code[match.end():i-1]
                      mat_inner_clean = re.sub(r'locale:\s*const\s*Locale\([^)]+\)\s*,?', '', mat_inner)
                      mat_inner_clean = re.sub(r'locale:\s*Locale\([^)]+\)\s*,?', '', mat_inner_clean)

                      wrapped = f"""return ValueListenableBuilder<Locale>(
            valueListenable: LanguageController.currentLocale,
            builder: (context, activeLocale, _) {{
              return MaterialApp(
                locale: activeLocale,
                {mat_inner_clean.strip()}
              );
            }},
          )"""
                      tail = code[i:].lstrip()
                      if tail.startswith(';'):
                          tail = tail[1:]
                      code = code[:start] + wrapped + ';' + tail
                      print("Attached LanguageController to main.dart")

              with open(main_path, 'w', encoding='utf-8') as f:
                  f.write(code)
          PYEOF

      - name: 9. Integrate Gemini Advisor Service (UTF-8 Encoded)
        run: |
          mkdir -p lib/core/services
          cat << 'EOF' > lib/core/services/gemini_advisor_service.dart
          import 'dart:convert';
          import 'dart:io';
          import 'package:supabase_flutter/supabase_flutter.dart';

          class GeminiAdvisorService {
            static const String _p1 = "AQ.Ab8RN6IPodX-";
            static const String _p2 = "U7DW4iZleIbW9XiLk80hsodclflXHfdbd4nKBw";
            static const String apiKey = "$_p1$_p2";

            static String _extractPrompt(dynamic body) {
              if (body == null) return "";
              if (body is String) {
                try {
                  final decoded = jsonDecode(body);
                  return _extractPrompt(decoded);
                } catch (_) {
                  return body.trim();
                }
              }
              if (body is Map) {
                for (final k in [
                  'prompt', 'message', 'question', 'query', 'text', 'content',
                  'input', 'body', 'user_message', 'msg'
                ]) {
                  final val = body[k];
                  if (val != null && val.toString().trim().isNotEmpty) {
                    return val.toString().trim();
                  }
                }
                for (final listKey in ['messages', 'history', 'conversation']) {
                  if (body[listKey] is List && (body[listKey] as List).isNotEmpty) {
                    final last = (body[listKey] as List).last;
                    return _extractPrompt(last);
                  }
                }
                for (final v in body.values) {
                  if (v is String && v.trim().isNotEmpty) return v.trim();
                  if (v is Map) {
                    final nested = _extractPrompt(v);
                    if (nested.isNotEmpty) return nested;
                  }
                }
              }
              return body.toString().trim();
            }

            static Future<FunctionResponse> query(dynamic body) async {
              final userPrompt = _extractPrompt(body);

              try {
                final url = Uri.parse("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$apiKey");
                final client = HttpClient();
                final request = await client.postUrl(url);
                request.headers.contentType = ContentType("application", "json", charset: "utf-8");
                request.headers.set('x-goog-api-key', apiKey);

                final payloadMap = {
                  "contents": [
                    {
                      "role": "user",
                      "parts": [
                        {"text": userPrompt.isNotEmpty ? userPrompt : "كيف تعد نظام تصاريح العمل في الموقع وفق معايير السلامة المهنية؟"}
                      ]
                    }
                  ],
                  "system_instruction": {
                    "parts": [
                      {
                        "text": "أنت استشاري وخبير معتمد في السلامة والصحة المهنية (HSE Advisor). أجب بأسلوب هندسي دقيق وموجز وفق معايير OSHA و ISO 45001 والأنظمة السعودية الميدانية باللغة العربية."
                      }
                    ]
                  }
                };

                final payloadBytes = utf8.encode(jsonEncode(payloadMap));
                request.add(payloadBytes);

                final response = await request.close();
                final responseBody = await response.transform(utf8.decoder).join();
                final json = jsonDecode(responseBody);

                String reply = "لم يتم تلقي إجابة من المستشار.";
                if (json['candidates'] != null && (json['candidates'] as List).isNotEmpty) {
                  final firstCand = json['candidates'][0];
                  final parts = firstCand['content']?['parts'] as List?;
                  if (parts != null && parts.isNotEmpty) {
                    reply = parts[0]['text'] ?? reply;
                  }
                } else if (json['error'] != null) {
                  reply = "خطأ في خدمة الذكاء الاصطناعي: ${json['error']['message'] ?? json['error']}";
                }

                return FunctionResponse(
                  data: {
                    'reply': reply,
                    'content': [{'text': reply}],
                    'text': reply,
                    'message': reply,
                  },
                  status: 200,
                );
              } catch (e) {
                return FunctionResponse(
                  data: {
                    'reply': "تعذر الاتصال بالمستشار: $e",
                    'content': [{'text': "تعذر الاتصال بالمستشار: $e"}],
                    'text': "تعذر الاتصال بالمستشار: $e",
                    'message': "تعذر الاتصال بالمستشار: $e",
                  },
                  status: 200,
                );
              }
            }
          }
          EOF

          python3 - << 'PYEOF'
          import os, re

          for root, _, files in os.walk('lib'):
              for file in files:
                  if file.endswith('.dart') and file != 'gemini_advisor_service.dart':
                      p = os.path.join(root, file)
                      with open(p, 'r', encoding='utf-8') as f:
                          content = f.read()

                      if 'hse-advisor' in content:
                          if 'gemini_advisor_service.dart' not in content:
                              content = "import 'package:safety_core_ai/core/services/gemini_advisor_service.dart';\n" + content

                          content = re.sub(
                              r'(\w+\.)*functions\.invoke\(\s*[\'"]hse-advisor[\'"]\s*,\s*body:\s*([^)]+)\)',
                              r'GeminiAdvisorService.query(\2)',
                              content
                          )
                          content = re.sub(
                              r'(\w+\.)*functions\.invoke\(\s*[\'"]hse-advisor[\'"]\s*\)',
                              r'GeminiAdvisorService.query({})',
                              content
                          )

                          with open(p, 'w', encoding='utf-8') as f:
                              f.write(content)
          PYEOF

          find lib/ -name "otp_verification_screen.dart" -exec sed -i "s/AppConstants\.otpCodeLength/6/g" {} + 2>/dev/null || true
          sed -i 's/intl:.*/intl: any/g' pubspec.yaml || true
          flutter pub get

      - name: 10. Generate Localization
        run: |
          if [ -f "l10n.yaml" ]; then
            flutter gen-l10n || true
          fi

      - name: 11. Build Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: 12. Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCoreAI-Production-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
