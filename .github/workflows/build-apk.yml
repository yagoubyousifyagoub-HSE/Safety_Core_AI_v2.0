name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # خطوة توليد مجلد أندرويد الناقص دون المساس بأكواد المشروع
      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            flutter create temp_shell --platforms=android --org com.safetycore.ai
            cp -r temp_shell/android ./
            rm -rf temp_shell
          fi
          # تثبيت اسم التطبيق الرسمي
          sed -i 's/android:label="[^"]*"/android:label="Safety Core AI"/g' android/app/src/main/AndroidManifest.xml || true

      - name: Install dependencies
        run: |
          sed -i 's/intl:.*/intl: any/g' pubspec.yaml || true
          flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n || true

      - name: Build release APK
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: safety-core-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
