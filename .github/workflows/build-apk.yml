name: Build Safety Core AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Extract Zip Archive to Project Root
        run: |
          mkdir -p temp_extract
          unzip -o \*.zip -d temp_extract/
          # البحث عن مكان pubspec.yaml ونقل ملفات المشروع كاملة للمسار الرئيسي
          PROJECT_DIR=$(find temp_extract -type f -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_DIR" ]; then
            cp -rf "$PROJECT_DIR"/* ./
          fi
          rm -rf temp_extract

      - name: 5. Ensure Android Platform & Fix Label
        run: |
          if [ ! -d "android" ]; then
            flutter create safety_core_ai --platforms=android --org com.safetycore.ai
            cp -r safety_core_ai/android ./
            rm -rf safety_core_ai
          fi
          sed -i 's/android:label="[^"]*"/android:label="Safety Core AI"/g' android/app/src/main/AndroidManifest.xml || true

      - name: 6. Install Dependencies
        run: |
          sed -i 's/intl:.*/intl: any/g' pubspec.yaml || true
          flutter pub get

      - name: 7. Generate Localization Files
        run: |
          if [ -f "l10n.yaml" ]; then
            flutter gen-l10n || true
          fi

      - name: 8. Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 9. Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCoreAI-Release
          path: build/app/outputs/flutter-apk/app-release.apk
