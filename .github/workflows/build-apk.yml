name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Extract Zip & Align Project Structure
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            mkdir -p extracted_temp
            unzip -o \*.zip -d extracted_temp/
            ROOT_PATH=$(find extracted_temp -type f -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
            if [ -n "$ROOT_PATH" ]; then
              cp -rf "$ROOT_PATH"/* ./
            fi
            chmod -R 777 extracted_temp || true
            sudo rm -rf extracted_temp
          fi

      - name: 5. Ensure Android Platform & Grant Permissions
        run: |
          if [ ! -d "android" ]; then
            flutter create safety_core_ai --platforms=android --org com.safetycore.ai
            cp -r safety_core_ai/android ./
            rm -rf safety_core_ai
          fi
          sed -i 's/android:label="[^"]*"/android:label="Safety Core AI"/g' android/app/src/main/AndroidManifest.xml || true
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml

      - name: 6. Fix OTP Input Field & Clipboard Paste
        run: |
          mkdir -p lib/features/auth/widgets
          cat << 'EOF' > lib/features/auth/widgets/otp_input_field.dart
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          class OtpInputField extends StatefulWidget {
            final int length;
            final ValueChanged<String>? onChanged;
            final ValueChanged<String>? onCompleted;

            const OtpInputField({
              super.key,
              this.length = 6,
              this.onChanged,
              this.onCompleted,
            });

            @override
            State<OtpInputField> createState() => _OtpInputFieldState();
          }

          class _OtpInputFieldState extends State<OtpInputField> with WidgetsBindingObserver {
            late final TextEditingController _controller;
            late final FocusNode _focusNode;

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              _controller = TextEditingController();
              _focusNode = FocusNode();
              WidgetsBinding.instance.addPostFrameCallback((_) {
                _focusNode.requestFocus();
              });
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed) {
                Future.delayed(const Duration(milliseconds: 250), () {
                  if (mounted) {
                    _focusNode.requestFocus();
                  }
                });
              }
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              _controller.dispose();
              _focusNode.dispose();
              super.dispose();
            }

            Future<void> _pasteFromClipboard() async {
              final data = await Clipboard.getData(Clipboard.kTextPlain);
              final text = data?.text?.trim() ?? '';
              final digits = text.replaceAll(RegExp(r'\D'), '');
              if (digits.isNotEmpty) {
                final code = digits.length > widget.length ? digits.substring(0, widget.length) : digits;
                _controller.text = code;
                _controller.selection = TextSelection.collapsed(offset: code.length);
                widget.onChanged?.call(code);
                if (code.length == widget.length) {
                  widget.onCompleted?.call(code);
                }
                setState(() {});
              }
            }

            @override
            Widget build(BuildContext context) {
              final currentText = _controller.text;
              return Column(
                mainAxisSize: MainAxisSize.min,
                children: [
                  GestureDetector(
                    behavior: HitTestBehavior.opaque,
                    onTap: () => _focusNode.requestFocus(),
                    child: Stack(
                      alignment: Alignment.center,
                      children: [
                        Opacity(
                          opacity: 0.0,
                          child: TextField(
                            controller: _controller,
                            focusNode: _focusNode,
                            keyboardType: TextInputType.number,
                            inputFormatters: [
                              FilteringTextInputFormatter.digitsOnly,
                              LengthLimitingTextInputFormatter(widget.length),
                            ],
                            enableInteractiveSelection: true,
                            autofocus: true,
                            onChanged: (val) {
                              setState(() {});
                              widget.onChanged?.call(val);
                              if (val.length == widget.length) {
                                widget.onCompleted?.call(val);
                              }
                            },
                          ),
                        ),
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                          children: List.generate(widget.length, (index) {
                            final char = index < currentText.length ? currentText[index] : '';
                            final isCurrent = _focusNode.hasFocus && index == currentText.length;
                            return Container(
                              width: 44,
                              height: 52,
                              alignment: Alignment.center,
                              decoration: BoxDecoration(
                                color: Colors.white.withOpacity(0.06),
                                borderRadius: BorderRadius.circular(10),
                                border: Border.all(
                                  color: isCurrent
                                      ? Theme.of(context).colorScheme.primary
                                      : (char.isNotEmpty ? Colors.blueAccent : Colors.white24),
                                  width: isCurrent ? 2.0 : 1.2,
                                ),
                              ),
                              child: Text(
                                char,
                                style: const TextStyle(
                                  fontSize: 22,
                                  fontWeight: FontWeight.bold,
                                  color: Colors.white,
                                ),
                              ),
                            );
                          }),
                        ),
                      ],
                    ),
                  ),
                  const SizedBox(height: 18),
                  OutlinedButton.icon(
                    onPressed: _pasteFromClipboard,
                    icon: const Icon(Icons.paste_rounded, size: 18),
                    label: const Text('لصق الرمز من الحافظة'),
                    style: OutlinedButton.styleFrom(
                      padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                    ),
                  ),
                ],
              );
            }
          }
          EOF

      - name: 7. Apply Inverted Navigation Fix & Language/Logout Features
        run: |
          # 1. إنشاء وحدة التحكم المركزية باللغة
          mkdir -p lib/core/services
          cat << 'EOF' > lib/core/services/language_controller.dart
          import 'package:flutter/material.dart';

          class LanguageController {
            static final ValueNotifier<Locale> currentLocale = ValueNotifier(const Locale('ar'));

            static void switchLanguage(String langCode) {
              currentLocale.value = Locale(langCode);
            }

            static void toggleLanguage() {
              currentLocale.value = currentLocale.value.languageCode == 'ar'
                  ? const Locale('en')
                  : const Locale('ar');
            }

            static bool get isArabic => currentLocale.value.languageCode == 'ar';
          }
          EOF

          # 2. تحديث شاشة "حول التطبيق" لتشمل تبديل اللغة وتسجيل الخروج الرسمي
          mkdir -p lib/features/about/screens
          cat << 'EOF' > lib/features/about/screens/about_app_screen.dart
          import 'package:flutter/material.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';
          import '../../auth/login_screen.dart';
          import '../../../core/services/language_controller.dart';

          class AboutAppScreen extends StatefulWidget {
            const AboutAppScreen({super.key});

            @override
            State<AboutAppScreen> createState() => _AboutAppScreenState();
          }

          class _AboutAppScreenState extends State<AboutAppScreen> {
            @override
            void initState() {
              super.initState();
              LanguageController.currentLocale.addListener(_onLocaleChanged);
            }

            @override
            void dispose() {
              LanguageController.currentLocale.removeListener(_onLocaleChanged);
              super.dispose();
            }

            void _onLocaleChanged() {
              if (mounted) setState(() {});
            }

            void _confirmLogout(BuildContext context, bool isAr) {
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                  title: Row(
                    children: [
                      const Icon(Icons.logout_rounded, color: Colors.redAccent),
                      const SizedBox(width: 8),
                      Text(isAr ? 'تسجيل الخروج' : 'Sign Out'),
                    ],
                  ),
                  content: Text(
                    isAr
                        ? 'هل أنت متأكد من رغبتك في تسجيل الخروج من التطبيق؟'
                        : 'Are you sure you want to sign out of the app?',
                  ),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(ctx),
                      child: Text(isAr ? 'إلغاء' : 'Cancel'),
                    ),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(
                        backgroundColor: Colors.redAccent,
                        foregroundColor: Colors.white,
                      ),
                      onPressed: () async {
                        Navigator.pop(ctx);
                        try {
                          await Supabase.instance.client.auth.signOut();
                        } catch (_) {}
                        if (mounted) {
                          Navigator.of(context, rootNavigator: true).pushAndRemoveUntil(
                            MaterialPageRoute(builder: (_) => const LoginScreen()),
                            (route) => false,
                          );
                        }
                      },
                      child: Text(isAr ? 'تأكيد الخروج' : 'Confirm'),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final isAr = LanguageController.currentLocale.value.languageCode == 'ar';
              final isDark = Theme.of(context).brightness == Brightness.dark;
              final userEmail = Supabase.instance.client.auth.currentUser?.email ??
                  (isAr ? 'حساب تجريبي / ضيف' : 'Demo Account / Guest');

              return Scaffold(
                appBar: AppBar(
                  title: Text(isAr ? 'حول التطبيق والإعدادات' : 'About & Settings'),
                  centerTitle: true,
                  elevation: 0,
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Container(
                      padding: const EdgeInsets.all(20),
                      decoration: BoxDecoration(
                        color: isDark ? const Color(0xFF1E293B) : Colors.white,
                        borderRadius: BorderRadius.circular(16),
                      ),
                      child: Column(
                        children: [
                          const Icon(Icons.health_and_safety_rounded, size: 52, color: Colors.blueAccent),
                          const SizedBox(height: 12),
                          Text(
                            isAr ? 'سيفيتي كور AI' : 'Safety Core AI',
                            style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold),
                          ),
                          const SizedBox(height: 4),
                          Text(
                            isAr ? 'نظام إدارة السلامة والصحة المهنية الذكي' : 'Intelligent HSE Management Platform',
                            textAlign: TextAlign.center,
                            style: TextStyle(fontSize: 13, color: isDark ? Colors.white70 : Colors.black54),
                          ),
                          const SizedBox(height: 8),
                          Container(
                            padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                            decoration: BoxDecoration(
                              color: Colors.blueAccent.withOpacity(0.12),
                              borderRadius: BorderRadius.circular(12),
                            ),
                            child: Text(
                              isAr ? 'الإصدار 2.0.0 (HSE Edition)' : 'Version 2.0.0 (HSE Edition)',
                              style: const TextStyle(fontSize: 11, fontWeight: FontWeight.w600, color: Colors.blueAccent),
                            ),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 18),
                    Container(
                      padding: const EdgeInsets.all(16),
                      decoration: BoxDecoration(
                        color: isDark ? const Color(0xFF1E293B) : Colors.white,
                        borderRadius: BorderRadius.circular(16),
                      ),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            children: [
                              const Icon(Icons.language_rounded, color: Colors.blueAccent),
                              const SizedBox(width: 8),
                              Text(
                                isAr ? 'لغة التطبيق' : 'App Language',
                                style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                              ),
                            ],
                          ),
                          const SizedBox(height: 12),
                          Row(
                            children: [
                              Expanded(
                                child: ElevatedButton(
                                  style: ElevatedButton.styleFrom(
                                    backgroundColor: isAr ? Colors.blueAccent : (isDark ? Colors.white12 : Colors.black12),
                                    foregroundColor: isAr ? Colors.white : (isDark ? Colors.white70 : Colors.black87),
                                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                                    padding: const EdgeInsets.symmetric(vertical: 12),
                                  ),
                                  onPressed: () => LanguageController.switchLanguage('ar'),
                                  child: const Text('العربية', style: TextStyle(fontWeight: FontWeight.bold)),
                                ),
                              ),
                              const SizedBox(width: 12),
                              Expanded(
                                child: ElevatedButton(
                                  style: ElevatedButton.styleFrom(
                                    backgroundColor: !isAr ? Colors.blueAccent : (isDark ? Colors.white12 : Colors.black12),
                                    foregroundColor: !isAr ? Colors.white : (isDark ? Colors.white70 : Colors.black87),
                                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                                    padding: const EdgeInsets.symmetric(vertical: 12),
                                  ),
                                  onPressed: () => LanguageController.switchLanguage('en'),
                                  child: const Text('English', style: TextStyle(fontWeight: FontWeight.bold)),
                                ),
                              ),
                            ],
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 18),
                    Container(
                      padding: const EdgeInsets.all(16),
                      decoration: BoxDecoration(
                        color: isDark ? const Color(0xFF1E293B) : Colors.white,
                        borderRadius: BorderRadius.circular(16),
                      ),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            children: [
                              const Icon(Icons.account_circle_outlined, color: Colors.blueAccent),
                              const SizedBox(width: 8),
                              Text(
                                isAr ? 'الحساب والمستخدم' : 'Account & User',
                                style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                              ),
                            ],
                          ),
                          const SizedBox(height: 12),
                          ListTile(
                            contentPadding: EdgeInsets.zero,
                            leading: const CircleAvatar(
                              backgroundColor: Colors.blueAccent,
                              child: Icon(Icons.person, color: Colors.white),
                            ),
                            title: Text(userEmail, style: const TextStyle(fontWeight: FontWeight.w600, fontSize: 14)),
                            subtitle: Text(
                              isAr ? 'مهندس سلامة وصحة مهنية معتمد' : 'Authorized HSE Engineer',
                              style: TextStyle(fontSize: 12, color: isDark ? Colors.white60 : Colors.black54),
                            ),
                          ),
                          const Divider(height: 24),
                          SizedBox(
                            width: double.infinity,
                            child: OutlinedButton.icon(
                              icon: const Icon(Icons.logout_rounded, color: Colors.redAccent),
                              label: Text(
                                isAr ? 'تسجيل الخروج من التطبيق' : 'Sign Out of App',
                                style: const TextStyle(color: Colors.redAccent, fontWeight: FontWeight.bold),
                              ),
                              style: OutlinedButton.styleFrom(
                                side: const BorderSide(color: Colors.redAccent, width: 1.2),
                                padding: const EdgeInsets.symmetric(vertical: 12),
                                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                              ),
                              onPressed: () => _confirmLogout(context, isAr),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

          # 3. تصحيح حسابات مؤشر شريط التنقل (Navigation Indicator RTL Fix)
          python3 - << 'PYEOF'
          import os, re

          nav_file = 'lib/core/widgets/elegant_bottom_nav.dart'
          if os.path.exists(nav_file):
              with open(nav_file, 'r', encoding='utf-8') as f:
                  code = f.read()

              # تصحيح إزاحة المؤشر لتتطابق مع الأيقونات في اللغة العربية والإنجليزية
              code = re.sub(
                  r'left:\s*(widget\.)?currentIndex\s*\*',
                  r'left: (Directionality.of(context) == TextDirection.rtl ? (4 - \1currentIndex) : \1currentIndex) *',
                  code
              )
              code = re.sub(
                  r'\*\s*(widget\.)?currentIndex',
                  r'* (Directionality.of(context) == TextDirection.rtl ? (4 - \1currentIndex) : \1currentIndex)',
                  code
              )
              code = re.sub(
                  r'Alignment\(\s*-1\.0\s*\+\s*\(?(widget\.)?currentIndex\s*\*',
                  r'Alignment(-1.0 + ((Directionality.of(context) == TextDirection.rtl ? (4 - \1currentIndex) : \1currentIndex) *',
                  code
              )
              code = re.sub(
                  r'Offset\(\s*(widget\.)?currentIndex\s*\*',
                  r'Offset((Directionality.of(context) == TextDirection.rtl ? (4 - \1currentIndex) : \1currentIndex) *',
                  code
              )

              with open(nav_file, 'w', encoding='utf-8') as f:
                  f.write(code)
              print("Navigation indicator successfully aligned for RTL and LTR.")
          PYEOF

          find lib/ -name "otp_verification_screen.dart" -exec sed -i "s/AppConstants\.otpCodeLength/6/g" {} + 2>/dev/null || true
          sed -i 's/intl:.*/intl: any/g' pubspec.yaml || true
          flutter pub get

      - name: 8. Generate Localization
        run: |
          if [ -f "l10n.yaml" ]; then
            flutter gen-l10n || true
          fi

      - name: 9. Build Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: 10. Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: safety-core-ai-fixed-otp
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
