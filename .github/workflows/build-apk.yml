          mkdir -p lib/core/services
          cat << 'EOF' > lib/core/services/language_controller.dart
          import 'package:flutter/material.dart';

          class LanguageController {
            static final ValueNotifier<Locale> currentLocale = ValueNotifier(const Locale('ar'));

            static void switchLanguage(String langCode) {
              currentLocale.value = Locale(langCode);
            }

            static void toggleLanguage() {
              currentLocale.value = currentLocale.value.languageCode == 'ar'
                  ? const Locale('en')
                  : const Locale('ar');
            }

            static bool get isArabic => currentLocale.value.languageCode == 'ar';
          }
          EOF

