name: Build Android APK

# Builds a release APK on every push to main, or manually via the
# "Run workflow" button in the GitHub Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Build release APK
        # SUPABASE_URL / SUPABASE_ANON_KEY come from this repo's
        # Settings -> Secrets and variables -> Actions -> New repository secret.
        # Never commit real keys directly into this file.
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: safety-core-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
